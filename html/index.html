<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/mobilefirst.css">
    <link rel="stylesheet" href="../css/outrasmq.css">
</head>
<body>
    
    <main>
        <article>
            <div id="img">
                 <!-- <img src="../imagens/logo-rstar-pq-final-png.png" alt="logo" id="logo"> -->
            </div>
            <div id="login">
                <h1>Faça seu Login</h1>
                <p>Insira seu CPF e senha abaixo para entrar na sua conta</p>
                <form action="" method="post" autocomplete="on">
                    <div class="esq">
                        <label for="icpf" class="tags">CPF</label>
                        <input type="text" name="cpf" id="icpf" autocomplete="username" placeholder="000.000.000-00" required>
                    </div>
                    <div class="esq">
                        <label for="isenha" class="tags">SENHA</label>
                        <input type="password" name="senha" id="isenha" autocomplete="current-password" required>
                    </div>
                    <p class="esq" id="botao"><a href="#">Esqueci minha senha</a></p>
                    <div>
                        <input type="submit" value="ENTRAR" id="entrar">
                    </div>
                    <p>
                        Ainda não possui cadastro? <a href="#">Cadastre-se aqui</a>
                    </p>
                </form>
            </div>
        </article>
    </main>
</body>
</html>
