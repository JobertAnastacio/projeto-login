<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/mobilefirst.css">
</head>
<body>
    <img src="../imagens/logo-rstar-pq-final-png.png" alt="logo" id="logo">
    <main>
        <article>
            <h1>Faça seu Login</h1>
            <p>Insira seu CPF e senha abaixo para entrar na sua conta</p>
            <form action="" method="post" autocomplete="on">
                <p class="esq">
                    <label for="icpf" class="tags">CPF</label>
                    <input type="text" name="cpf" id="icpf" autocomplete="username" placeholder="000.000.000-00">
                </p>
                <p class="esq">
                    <label for="isenha" class="tags">SENHA</label>
                    <input type="password" name="senha" id="isenha" autocomplete="current-password">
                </p>
                <p class="esq"><a href="#">Esqueci minha senha</a></p>
                <p>
                    <input type="submit" value="ENTRAR" id="entrar">
                </p>
                <p>
                    Ainda não possui cadastro? <a href="#">Cadastre-se aqui</a>
                </p>
            </form>
        </article>
    </main>
</body>
</html>
